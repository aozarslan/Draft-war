name: gitleaks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # her Pazartesi 06:00 UTC - tam geçmiş taraması
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks CLI'yi doğrudan çalıştırır (marketplace action'ların aksine push/PR
      # event'inde sadece yeni commit'leri değil, --log-opts=--all ile TÜM git
      # geçmişini tarar). Sızıntı bulunursa gitleaks exit code 1 döner, bu step
      # (dolayısıyla workflow) fail olur. --redact, secret değerlerinin Actions
      # log'larına düz metin yazılmasını engeller.
      - name: Run gitleaks (full history)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --log-opts=--all --redact -v
